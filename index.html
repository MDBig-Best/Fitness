<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD-Fitness</title>
<meta name="theme-color" content="#16365f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MD-Fitness">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --page:#f2f2ef; --card:#fcfcfb; --card2:#f2f1ed; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --accent:#2a78d6; --accent-ink:#fff; --head:#16365f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6; --s7:#008300; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --goodtxt:#006300;
  --seq1:#cde2fb; --seq2:#86b6ef; --seq3:#3987e5; --seq4:#1c5cab; --seq5:#0d366b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --card:#1a1a19; --card2:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --accent:#3987e5; --head:#0f2440;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#008300; --s8:#e66767;
    --goodtxt:#4cc94c;
    --seq1:#163052; --seq2:#184f95; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#9ec5f4;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --card:#1a1a19; --card2:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --accent:#3987e5; --head:#0f2440;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#008300; --s8:#e66767;
  --goodtxt:#4cc94c;
  --seq1:#163052; --seq2:#184f95; --seq3:#2a78d6; --seq4:#5598e7; --seq5:#9ec5f4;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header.top .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1}
header.top .sub{font-size:13px;opacity:.75}
main{max-width:760px;margin:0 auto;padding:12px 16px 24px}
section.view{display:none}
section.view.on{display:block}
h2{font-size:20px;margin:14px 2px 10px}
h3{font-size:15px;margin:0 0 8px;color:var(--ink2);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .ink2{color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink2)}
.tile .val{font-size:24px;font-weight:700;letter-spacing:-.3px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .val small{font-size:13px;font-weight:500;color:var(--ink2)}
.tile .hint{font-size:12px;color:var(--muted);margin-top:2px}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--card2);color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 11px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.actions .btn{flex-direction:column;font-size:13px;padding:10px 6px;min-height:72px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.actions .btn svg{width:24px;height:24px;color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filterbar{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:10;background:var(--page);padding:6px 0 8px;margin:0 -2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--page);border-radius:11px;padding:11px 12px;min-height:46px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.big-in{font-size:30px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chip .dot,.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip.on{border-color:var(--ink);background:var(--card2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;background:var(--card2);color:var(--ink);white-space:nowrap}
.badge i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* Kalender */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head .t{flex:1;text-align:center;font-weight:700;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11.5px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.08;border-radius:10px;background:var(--page);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;padding-top:4px;cursor:pointer;position:relative;min-width:0}
.cal .d .n{font-size:13.5px;font-weight:600}
.cal .d.out{opacity:.35}
.cal .d.today .n{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px}
.cal .d.sel{border-color:var(--ink)}
.cal .d.has{background:var(--card2)}
.cal .d .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:3px;padding:0 2px}
.cal .d .dots i{width:7px;height:7px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.ln{width:14px;height:3px;border-radius:2px}
.legend i.dash{width:14px;height:0;border-top:2px dashed var(--muted);border-radius:0}
/* Listen */
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .main{flex:1;min-width:0}
.list .it .ttl{font-weight:600}
.list .it .meta{font-size:13px;color:var(--ink2)}
.list .it .num{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:600;color:var(--ink2);padding:6px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
table.t td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
.tscroll{overflow-x:auto}
/* Balken */
.hbar{display:grid;grid-template-columns:minmax(96px,118px) 1fr minmax(56px,auto);align-items:center;gap:8px;font-size:13.5px;padding:4px 0}
.hbar .b{height:14px;background:var(--card2);border-radius:4px;overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:0 4px 4px 0}
.hbar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--card)}
.stack i{display:block;height:100%}
/* Diagramme */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.chart .reflbl{font-size:10.5px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:9px;padding:7px 9px;font-size:12.5px;line-height:1.35;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* Heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--card2);display:block}
.heatwrap{display:flex;gap:6px}
.heatwrap .wl{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10px;color:var(--muted)}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:2px 0 6px}
.sheet .foot{display:flex;gap:8px;margin-top:16px}
.sheet .foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* Foto */
.photo{position:relative;border-radius:12px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.photo img{display:block;width:100%;max-height:52vh;object-fit:contain}
.photo .sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border-radius:6px;display:none}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:13px;color:var(--ink2);background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:10px}
.exrow{display:grid;grid-template-columns:1fr 52px 52px 62px 32px;gap:6px;margin-bottom:6px}
.exrow input{padding:9px 7px;min-height:40px;font-size:14px}
.exrow button{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.warnbox{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card));border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.sectnav{margin-bottom:10px}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:14px;font-size:15px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
details.card[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.card>.dbody{padding:0 14px 14px}
.tile.link{cursor:pointer}
.tile.link:active{transform:scale(.98)}
.ana{padding:12px 0;border-top:1px solid var(--line)}
.ana:first-of-type{border-top:0;padding-top:4px}
.ana .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ana .hd .nm{font-weight:700;font-size:15px}
.ana .hd .vv{margin-left:auto;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ana .ex{font-size:12.5px;color:var(--ink2);margin-top:6px}
.scale{position:relative;margin:12px 0 2px;padding-top:12px}
.scale .bar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.scale .bar i{display:block;height:100%}
.scale .mk{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink);transform:translateX(-7px)}
.scale .lbls{display:flex;gap:2px;margin-top:4px}
.scale .lbls span{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2;overflow:hidden}
.scale .lbls span.on{color:var(--ink);font-weight:700}
.chartsel{margin-bottom:10px}
.hdrbtn{border:0;background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;margin-left:4px}
.actions .btn{font-size:12px}
.aic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none}
.mmap{position:relative;overflow:hidden;background:var(--card2);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;touch-action:none;user-select:none;-webkit-user-select:none}
.mm-tiles{position:absolute;inset:0}
.mm-t{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none}
:root[data-theme="dark"] .mm-tiles{filter:brightness(.75) invert(1) hue-rotate(180deg) contrast(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mm-tiles{filter:brightness(.75) invert(1) hue-rotate(180deg) contrast(.9)}}
.mm-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mm-attr{position:absolute;right:4px;bottom:3px;font-size:9.5px;background:rgba(255,255,255,.75);color:#333;padding:0 4px;border-radius:3px}
.mm-ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mm-ctl button{width:36px;height:36px;border-radius:10px;border:0;background:var(--card);color:var(--ink);font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.mapbox{height:240px;border-radius:14px;margin:10px 0;border:1px solid var(--line)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;margin:10px 0}
.stat3 div{display:flex;flex-direction:column;align-items:flex-start}
.stat3 b{font-size:20px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12px;color:var(--ink2)}
#recView{position:fixed;inset:0;z-index:80;background:var(--page);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));overflow-y:auto}
body.recording{overflow:hidden}
.rv-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rv-sport{font-weight:700;font-size:17px;flex:1}
.rv-x{border:0;background:var(--card2);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.gps{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--card2);padding:5px 10px;border-radius:999px;white-space:nowrap}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.gps.ok i{background:var(--good)} .gps.mid i{background:var(--warn)} .gps.bad i{background:var(--crit)}
.rv-map{height:32vh;min-height:180px;border-radius:16px;border:1px solid var(--line);flex:none}
.rv-time{font-size:58px;font-weight:800;text-align:center;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:10px 0 4px;line-height:1}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv-grid div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.rv-grid span{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.rv-grid small{font-size:12px;color:var(--ink2)}
.rv-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rv-sel .chip{padding:6px 10px;min-height:36px;font-size:13px}
.rv-btns{display:flex;gap:10px;margin-top:12px}
.rv-btns .btn{flex:1;min-height:60px;font-size:18px}
.rv-btns .rv-big{flex:2}
.rv-note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  header.top,nav.tabs,main,.sheet,.sheet-bg,.toast{display:none!important}
  #printArea{display:block;font:11pt Arial,sans-serif;color:#000;padding:10mm}
  #printArea table{width:100%;border-collapse:collapse;font-size:10pt}
  #printArea th,#printArea td{border-bottom:1px solid #bbb;padding:3px 5px;text-align:right}
  #printArea th:first-child,#printArea td:first-child,#printArea th:nth-child(2),#printArea td:nth-child(2){text-align:left}
  #printArea h1{font-size:16pt;margin:0 0 4px}
  #printArea .chart svg{max-height:70mm}
}
@media (min-width:600px){ .tiles{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<header class="top">
  <div class="logo">MD</div>
  <div style="flex:1">
    <h1 id="hdrTitle">Übersicht</h1>

    } else {

  const hide = () => { tip.classList.remove('on'); xh.setAttribute('opacity', 0); hl.innerHTML = ''; };
  const show = ev => {
    const r = sv.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;

}

/* Säulendiagramm: bars [{l, v, tip}] */
function barChart(el, o) {
  const W = Math.max(260, el.clientWidth || 320), H = o.h || 170, P = { l: 30, r: 6, t: 10, b: 24 };
  const bars = o.bars; if (!bars.length) { el.innerHTML = '<div class="empty">Keine Daten</div>'; return; }
  const ticks = niceTicks(0, Math.max(1, ...bars.map(b => b.v)), 3), hi = ticks[ticks.length - 1];
  const bw = (W - P.l - P.r) / bars.length, gap = Math.max(2, bw * 0.25);
  const Y = v => P.t + (hi - v) / hi * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.label || '')}">`;
  for (const v of ticks) svg += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${P.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${f0(v)}</text>`;
  const every = Math.ceil(bars.length / Math.floor((W - P.l) / 34));
  bars.forEach((b, i) => {
    const x = P.l + i * bw + gap / 2, w = bw - gap, y = Y(b.v), h = Y(0) - y, r = Math.min(4, w / 2, h);
    if (b.v > 0) svg += `<path d="M${x},${Y(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${Y(0)}Z" fill="${b.c || o.color}"/>`;
    if (i % every === 0) svg += `<text class="ax" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(b.l)}</text>`;
    svg += `<rect x="${P.l + i * bw}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="transparent" data-i="${i}"/>`;
  });
  el.innerHTML = svg + '</svg><div class="tip"></div>';
  const tip = $('.tip', el), sv = $('svg', el);
  const show = e => {
    const i = e.target.dataset && e.target.dataset.i; if (i == null) return;
    const b = bars[i], r = sv.getBoundingClientRect();
    tip.innerHTML = b.tip || `${esc(b.l)}: <b>${f0(b.v)}</b>`; tip.classList.add('on');
    const px = (P.l + (+i + .5) * bw) / W * r.width, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, px - tw / 2), r.width - tw) + 'px'; tip.style.top = '-6px'; tip.style.transform = 'translateY(-100%)';
  };
  sv.addEventListener('pointermove', show); sv.addEventListener('pointerdown', show);
  sv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tip.classList.remove('on'); });
  el._hide = () => tip.classList.remove('on');
}
function hbars(rows, color, max) {
  max = max || Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hbar"><div>${r.dot ? `<span class="dot" style="background:${r.dot};margin-right:6px"></span>` : ''}${esc(r.l)}</div><div class="b"><i style="width:${(r.v / max * 100).toFixed(1)}%;background:${r.c || color}"></i></div><div class="v">${r.txt ?? f0(r.v)}</div></div>`).join('');
}

/* Einstufungsskala mit Markierung */
function scaleBar(segs, value, min, max) {
  const w = segs.map((sg, i) => ((sg.to ?? max) - (i ? segs[i - 1].to : min)) / (max - min) * 100);

const NEUTRAL = 'var(--muted)';
const ageNow = () => S.settings.birthYear ? new Date().getFullYear() - S.settings.birthYear : null;
// Körperfett nach ACE (American Council on Exercise)
function fatSegs(sex) {
  return sex === 'w'
    ? [{ to: 14, n: 'Sehr niedrig', c: 'var(--warn)' }, { to: 21, n: 'Athletisch', c: 'var(--good)' }, { to: 25, n: 'Fit', c: 'var(--good)' }, { to: 32, n: 'Durch­schnitt', c: NEUTRAL }, { n: 'Hoch', c: 'var(--serious)' }]
    : [{ to: 6, n: 'Sehr niedrig', c: 'var(--warn)' }, { to: 14, n: 'Athletisch', c: 'var(--good)' }, { to: 18, n: 'Fit', c: 'var(--good)' }, { to: 25, n: 'Durch­schnitt', c: NEUTRAL }, { n: 'Hoch', c: 'var(--serious)' }];
}
// FFMI = fettfreie Masse / Größe², normiert auf 1,80 m (Kouri 1995)
function ffmi(weight, fat, hcm) {
  if (!weight || fat == null || !hcm) return null;
  const h = hcm / 100, ffm = weight * (1 - fat / 100), v = ffm / (h * h);
  return { ffm, raw: v, norm: v + 6.1 * (1.8 - h) };
}
function ffmiSegs(sex) {
  return sex === 'w'
    ? [{ to: 14.5, n: 'Gering', c: 'var(--seq1)' }, { to: 16.5, n: 'Durch­schnitt', c: 'var(--seq2)' }, { to: 18, n: 'Trainiert', c: 'var(--seq3)' }, { to: 20.5, n: 'Sehr musku­lös', c: 'var(--seq4)' }, { n: 'Außer­gewöhnlich', c: 'var(--seq5)' }]
    : [{ to: 18, n: 'Gering', c: 'var(--seq1)' }, { to: 20, n: 'Durch­schnitt', c: 'var(--seq2)' }, { to: 22, n: 'Trainiert', c: 'var(--seq3)' }, { to: 25, n: 'Sehr musku­lös', c: 'var(--seq4)' }, { n: 'Außer­gewöhnlich', c: 'var(--seq5)' }];
}
// Taille-zu-Größe-Verhältnis (WHtR), Grenze altersabhängig
function whtrSegs() {
  const a = ageNow(), t = a == null || a < 40 ? 0.5 : a > 50 ? 0.6 : 0.5 + (a - 40) / 100;
  return [{ to: 0.4, n: 'Sehr schlank', c: 'var(--warn)' }, { to: t, n: 'Gesund', c: 'var(--good)' }, { to: t + 0.1, n: 'Erhöht', c: 'var(--warn)' }, { n: 'Deutlich erhöht', c: 'var(--serious)' }];
}

function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/octet-stream' });
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    navigator.share({ files: [file], title: name }).catch(() => dl());
  } else dl();
  function dl() { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
}
async function exportJSON() {
  S.settings.lastBackup = today(); save();
  let tracks = []; try { tracks = await IDB.all('tracks'); } catch (e) { }
  download(`MD-Fitness_Sicherung_${today()}.json`, JSON.stringify({ app: 'MD-Fitness', version: 2, exported: new Date().toISOString(), data: S, tracks }), 'application/json');
  toast('Sicherung erstellt'); render();
}

  for (const m of sortBP()) lines.push(['Blutdruck', m.ts.slice(0, 10), m.ts.slice(11, 16), m.sys, m.dia, m.pul || '', bpClass(m.sys, m.dia).n, m.note || ''].join(';'));
  for (const a of (S.activities || []).slice().sort((x, y) => x.start < y.start ? -1 : 1)) lines.push(['Aktivität', a.start.slice(0, 10), a.start.slice(11, 16), f1(a.dist / 1000, 2), fDur(a.dur), a.gain || '', SP(a.sport).n + ' / ' + tempoTxt(a) + (a.hr ? ' / Puls ' + a.hr : ''), a.note || ''].join(';'));
  for (const b of sortBody()) lines.push(['Körper', b.date, '', b.weight ?? '', b.fat ?? '', b.muscle ?? '', 'Gewicht kg / Fett % / Muskel ' + (b.mUnit || S.settings.muscleUnit) + (b.waist != null ? ' / Bauch ' + b.waist + ' cm' : ''), b.note || ''].join(';'));

$('#fileImport').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), d = j.data || j;
    if (!d.workouts && !d.bp && !d.body && !d.activities) throw new Error('Keine MD-Fitness-Sicherung');
    const merge = (a, b) => { const m = new Map(a.map(x => [x.id, x])); for (const x of b || []) m.set(x.id, x); return [...m.values()]; };
    const cnt = (d.workouts || []).length + (d.bp || []).length + (d.body || []).length + (d.activities || []).length;
    if (!confirm(`Sicherung mit ${cnt} Einträgen einlesen? Vorhandene Daten bleiben erhalten, gleiche Einträge werden überschrieben.`)) return;
    S.workouts = merge(S.workouts, d.workouts); S.bp = merge(S.bp, d.bp); S.body = merge(S.body, d.body); S.activities = merge(S.activities || [], d.activities); S.labs = merge(S.labs || [], d.labs);
    for (const t of j.tracks || []) if (t && t.id) await IDB.put('tracks', t.id, t);
    if (d.settings) {
      const cg = new Map((d.settings.customGroups || []).concat(S.settings.customGroups || []).map(g => [g.k, g]));
      S.settings = Object.assign({}, S.settings, d.settings, { customGroups: [...cg.values()], lastBackup: S.settings.lastBackup || d.settings.lastBackup });
    }
    save(); render(); toast('Sicherung eingelesen');
  } catch (err) { alert('Datei konnte nicht gelesen werden: ' + err.message); }
});

/* ---------- Theme & Installation ---------- */
function applyTheme() { const t = S.settings.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme();
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (TAB === 'more') renderMore(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
document.addEventListener('DOMContentLoaded', () => { render(); checkUnfinished(); });
</script>
